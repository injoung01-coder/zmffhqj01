<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 응원 한마디</title>
  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #ff7a59;
      --accent-dark: #e8603e;
      --error: #c0392b;
      --error-bg: #fdecea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 20px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    main {
      width: 100%;
      max-width: 520px;
    }
    h1 {
      font-size: 2rem;
      text-align: center;
      margin: 0 0 24px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 12px;
    }
    input {
      width: 100%;
      font-size: 1.2rem;
      padding: 16px;
      border: 2px solid #e5ddd5;
      border-radius: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 16px;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #result {
      margin-top: 24px;
      min-height: 120px;
      padding: 24px;
      border-radius: 20px;
      background: var(--card);
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    #result.loading { color: var(--muted); font-weight: 400; }
    #result.error {
      color: var(--error);
      background: var(--error-bg);
      font-size: 1.1rem;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 응원 한마디</h1>
    <form id="form" class="card">
      <label for="name">공개용 닉네임</label>
      <p class="hint">실명 대신 닉네임을 적어 주세요. 비워 두면 "여러분"으로 불러 드려요.</p>
      <input id="name" type="text" maxlength="20" autocomplete="off" placeholder="예: 햇살">
      <button id="btn" type="submit">응원 받기</button>
    </form>
    <div id="result" aria-live="polite">버튼을 누르면 응원 한마디가 나타나요.</div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("name");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    function show(text, state) {
      result.textContent = text;
      result.className = state || "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();

      btn.disabled = true;
      show("응원 문장을 불러오는 중이에요…", "loading");

      try {
        const res = await fetch("api/message?name=" + encodeURIComponent(name), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data || typeof data.message !== "string") throw new Error("잘못된 응답");
        show(data.message);
      } catch (err) {
        show("응원 문장을 불러오지 못했어요. 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.", "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
